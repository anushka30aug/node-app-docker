name: CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/node-app:${{ github.sha }} .

    - name: Push Docker Image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/node-app:${{ github.sha }}






    - name: Update K8s Manifest Repo
      run: |
        git clone https://github.com/anushka30aug/k8s-gitops.git
        cd k8s-gitops

        sed -i "s|image: .*|image: anushkashukla003/node-app:${{ github.sha }}|" Deployment.yaml

        git config user.name "github-actions"
        git config user.email "actions@github.com"

        git add .
        git commit -m "Update image to ${{ github.sha }}"
        git push https://${{ secrets.GH_TOKEN }}@github.com/anushka30aug/k8s-gitops.git